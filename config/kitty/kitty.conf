# Шрифт
font_family      JetBrainsMono Nerd Font
font_size        11.0
disable_ligatures never

# Поведение
cursor_shape             block
cursor_blink_interval    0
scrollback_lines         10000
enable_audio_bell        no
confirm_os_window_close  0
copy_on_select           no
strip_trailing_spaces    smart
update_check_interval    0

# Вид
window_padding_width     8
hide_window_decorations  yes
tab_bar_edge             bottom
tab_bar_style            separator
tab_separator            "  "
active_tab_foreground    #ededed
active_tab_background    #0c0c0c
inactive_tab_foreground  #4f4f4f
inactive_tab_background  #0c0c0c
tab_bar_background       #0c0c0c

# Монохромная палитра (ANSI-цвета приглушены, чтобы git diff и т.п. оставались читаемыми)
foreground            #c8c8c8
background            #0c0c0c
selection_foreground  none
selection_background  #303030
cursor                #c8c8c8
cursor_text_color     #0c0c0c
url_color             #a0a0a0

color0   #1a1a1a
color8   #4f4f4f
color1   #b36b6b
color9   #c78585
color2   #8fa37a
color10  #a3b58f
color3   #c2a86b
color11  #d1bb85
color4   #7a8fa3
color12  #8fa3b8
color5   #9c84a6
color13  #b09abb
color6   #7aa39c
color14  #8fb8b0
color7   #c8c8c8
color15  #ededed

# Горячие клавиши
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
