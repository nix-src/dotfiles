general {
    hide_cursor        = true
    ignore_empty_input = true
}

background {
    monitor =
    color   = rgb(0c0c0c)
}

label {
    monitor     =
    text        = $TIME
    font_size   = 72
    font_family = JetBrainsMono Nerd Font
    color       = rgb(ededed)
    position    = 0, 90
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d %B"
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    color       = rgb(6b6b6b)
    position    = 0, 20
    halign      = center
    valign      = center
}

input-field {
    monitor           =
    size              = 280, 38
    outline_thickness = 1
    rounding          = 0
    dots_size         = 0.2
    dots_spacing      = 0.4
    dots_center       = true
    outer_color       = rgb(3a3a3a)
    inner_color       = rgb(121212)
    font_color        = rgb(c8c8c8)
    check_color       = rgb(8a8a8a)
    fail_color        = rgb(b36b6b)
    fail_text         = $FAIL
    font_family       = JetBrainsMono Nerd Font
    placeholder_text  =
    fade_on_empty     = false
    position          = 0, -40
    halign            = center
    valign            = center
}
