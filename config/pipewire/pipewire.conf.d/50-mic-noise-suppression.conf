# Шумоподавление микрофона (RNNoise, пакет noise-suppression-for-voice).
#
# Создаёт виртуальный микрофон «Микрофон (шумоподавление)», который берёт звук
# с микрофона по умолчанию и убирает фон: гул, вентиляторы, клавиатуру.
# У него приоритет выше, чем у обычного микрофона, поэтому программы выбирают
# его сами. Фильтр работает только пока кто-то пишет с микрофона (node.passive).
#
# Если программа всё равно пишет с обычного микрофона, выбери источник
# вручную в pavucontrol (вкладка «Устройства ввода» или «Запись»), либо
# найди его номер в `wpctl status` и выполни `wpctl set-default <номер>`.
#
# VAD Threshold — насколько уверенно RNNoise должен «слышать» голос, чтобы
# пропустить звук: выше — тише фон, но могут обрезаться начала слов.

context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Микрофон (шумоподавление)"
            media.name       = "Микрофон (шумоподавление)"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = librnnoise_ladspa
                        label  = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)"          = 50.0
                            "VAD Grace Period (ms)"      = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
            }
            capture.props = {
                node.name      = "capture.mic_rnnoise"
                node.passive   = true
                audio.rate     = 48000
                audio.position = [ MONO ]
            }
            playback.props = {
                node.name        = "mic_rnnoise"
                media.class      = Audio/Source
                audio.rate       = 48000
                audio.position   = [ MONO ]
                priority.session = 2500
                priority.driver  = 2500
            }
        }
    }
]
