context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Микрофон (шумоподавление)"
            media.name       = "Микрофон (шумоподавление)"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = librnnoise_ladspa
                        label  = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)"          = 50.0
                            "VAD Grace Period (ms)"      = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
            }
            capture.props = {
                node.name      = "capture.mic_rnnoise"
                node.passive   = true
                audio.rate     = 48000
                audio.position = [ MONO ]
            }
            playback.props = {
                node.name        = "mic_rnnoise"
                media.class      = Audio/Source
                audio.rate       = 48000
                audio.position   = [ MONO ]
                priority.session = 2500
                priority.driver  = 2500
            }
        }
    }
]
